# GitHub Pages Configuration
#
# This workflow builds the repository's website and deploys it using GitHub Pages.
name: Deploy website with GitHub Pages

on:
  # Run on all pushes to main.
  push:
    branches: ['main']
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

# We have two jobs:
# (1) A "build" job that's responsible for building the website using Jekyll.
# (2) A "deploy" job that pushes the output of the build job to GitHub Pages.
jobs:
  # (1) Build job
  build:
    runs-on: ubuntu-latest

    # Sequence of tasks for this job
    steps:
      # Check out latest code using a pre-existing GH action
      # Docs: https://github.com/actions/checkout
      - name: 📁 Checkout code
        uses: actions/checkout@v2

      - name: 💎 Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Ruby version is read from .ruby-version.
          bundler-cache: true

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: 🛠 Build Jekyll website
        env:
          JEKYLL_ENV: production
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          bundle exec ruby -ryaml -e 'puts({"url" => ENV.fetch("PAGES_ORIGIN"), "baseurl" => ENV.fetch("PAGES_BASE_PATH")}.to_yaml)' > "$RUNNER_TEMP/primer-spec-pages.yml"
          bundle exec jekyll build --config "_config.yml,$RUNNER_TEMP/primer-spec-pages.yml"

      # Keep the existing PDF generation without its hard-coded Ruby 3.0 build.
      # Docs: https://github.com/seshrs/build-primer-spec-action
      - name: 📑 Generate Primer Spec PDFs
        uses: seshrs/build-primer-spec-action@v1
        with:
          build_jekyll_site: 'false'
          configure_github_pages: 'false'

      # Upload the _site directory created in the above step for use by
      # GitHub Pages.
      # Docs: https://github.com/actions/upload-pages-artifact
      - name: 🏺 Upload artifact
        uses: actions/upload-pages-artifact@v1

  # (2) Deploy job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v1
