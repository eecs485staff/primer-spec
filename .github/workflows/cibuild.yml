name: cibuild

on:
  pull_request:
  push:
    branches:
      - master # NOTE: Remove this line when master branch is removed.
      - main
      - develop

jobs:
  cibuild:
    name: cibuild
    runs-on: ubuntu-latest
    steps:
      - name: 📁 Checkout code
        uses: actions/checkout@v2

      - name: 💎 Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true

      - name: ⬢ Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: ⚙️ Install dependencies
        run: |
          npm ci

      - name: 🛠 Run CI tests
        run: |
          ./script/cibuild
